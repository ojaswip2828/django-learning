<!DOCTYPE html>
<html>
<head>
    <title>Delete Task - CBV</title>
</head>
<body>

    <h1>Delete Task - Class Based View</h1>

    <p>Are you sure you want to delete "{{ object.title }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>

    <a href="/cbv/tasks/">Cancel</a>

</body>
</html>
