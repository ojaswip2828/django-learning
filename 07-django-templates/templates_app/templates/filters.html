<!DOCTYPE html>
<html>
<head>
    <title>Template Filters</title>
</head>

<body>

    <h1>Template Filters</h1>

    <p>Original: {{ name }}</p>
    <p>Uppercase: {{ name|upper }}</p>
    <p>Lowercase: {{ name|lower }}</p>
    <p>Title: {{ name|title }}</p>
    <p>Number of subjects: {{ subjects|length }}</p>
    <p>Nickname: {{ nickname|default:"No nickname" }}</p>

</body>
</html>
